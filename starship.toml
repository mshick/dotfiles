palette = "poimandres-storm"

format = """
$directory\
[](bg:blueish-green fg:lower-mint)\
$git_branch\
$git_state\
[](bg:focus fg:blueish-green)\
${custom.git_dirty}\
${custom.git_clean}\
$character\
"""

[palettes.poimandres-storm]
bg                  = "#252b37"
black               = "#101010"
blueish-green       = "#42675a"
bluish-gray         = "#607487"
bluishGray-brighter = "#7390aa"
bright-mint         = "#5de4c7"
bright-yellow       = "#fffac2"
darker-gray         = "#868cad"
desaturated-blue    = "#91b4d5"
focus               = "#404350"
gray                = "#a6accd"
hot-red             = "#d0679d"
light-blue          = "#add7ff"
lower-blue          = "#89ddff"
lower-mint          = "#5fb3a1"
off-white           = "#e4f0fb"
pink                = "#f087bd"
selection           = "#33394a"
white               = "#ffffff"

[character]
error_symbol   = "\n[❯](red)"
success_symbol = "\n[❯](purple)"
vimcmd_symbol  = "\n[❮](green)"

[battery]
disabled = true

[cmd_duration]
format = "[$duration](gray)"

[directory]
format = "[](bright-mint)[ ](bg:bright-mint)[](bg:lower-mint fg:bright-mint)[ $path ](bg:lower-mint fg:black)"

[git_branch]
format            = "[ $branch ](bg:blueish-green fg:off-white)"
truncation_length = 30
truncation_symbol = "…"

[git_state]
format = "[ $state( $progress_current/$progress_total)](bg:blueish-green fg:bright-yellow)"

[git_status]
disabled = true

[git_metrics]
disabled = true

[custom.git_dirty]
command = "echo '✗'"
when    = "git rev-parse --is-inside-work-tree 2>/dev/null && git status --porcelain 2>/dev/null | grep -q ."
format  = "[ $output ](bg:focus fg:hot-red)[](fg:focus)"

[custom.git_clean]
command = "echo '✓'"
when    = "git rev-parse --is-inside-work-tree 2>/dev/null && ! git status --porcelain 2>/dev/null | grep -q ."
format  = "[ $output ](bg:focus fg:bright-mint)[](fg:focus)"

[nodejs]
disabled = true

[package]
disabled = true

[ruby]
disabled = true

[lua]
disabled = true

[golang]
disabled = true

[rust]
disabled = true

[python]
disabled = true

[elixir]
disabled = true
